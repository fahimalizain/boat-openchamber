<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boat</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--oc-bg, transparent);
    color: var(--oc-fg, inherit);
    font-family: var(--oc-font, system-ui, sans-serif);
    font-size: 13px;
    line-height: 1.45;
    overflow: hidden;
  }
  #root { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px 4px;
  }
  .title { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--oc-muted, inherit); }
  .live {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    padding: 1px 7px; border-radius: 999px;
    border: 1px solid currentColor; color: var(--oc-muted, inherit);
  }
  .live.on { color: var(--oc-success, #16a34a); }
  .banner { padding: 0 12px 6px; }
  .block { padding: 4px 12px 8px; }
  .meta {
    margin-top: 4px; font-size: 11px; color: var(--oc-muted, inherit);
    font-family: var(--oc-mono, ui-monospace, monospace);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row, .slot-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row { margin-top: 8px; }
  .slot { display: inline-flex; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 2px 0 6px;
  }
  .section-title {
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--oc-muted, inherit);
  }
  .conv-list { max-height: 190px; overflow-y: auto; }
  .chat-wrap { flex: 1 1 auto; min-height: 90px; display: flex; flex-direction: column; }
  #chat-empty { padding: 4px 12px 12px; }
  .chat {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .msg { border-radius: 8px; padding: 6px 8px; }
  .msg.user { background: var(--oc-subtle, rgba(127, 127, 127, .10)); }
  .msg.assistant { background: var(--oc-elevated, transparent); border: 1px solid var(--oc-border, rgba(127, 127, 127, .25)); }
  .msg.system { color: var(--oc-muted, inherit); }
  .msg.failed { border: 1px solid var(--oc-error, #dc2626); }
  .msg-head {
    display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
    font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--oc-muted, inherit);
  }
  .msg-head .tag {
    padding: 0 5px; border-radius: 999px; border: 1px solid currentColor;
    font-size: 9px; letter-spacing: .04em;
  }
  .msg-head .tag.live { color: var(--oc-success, #16a34a); }
  .msg-head .tag.bad { color: var(--oc-error, #dc2626); }
  .msg-text { white-space: pre-wrap; word-break: break-word; }
  .msg-error {
    margin-top: 4px; white-space: pre-wrap; word-break: break-word;
    color: var(--oc-error-text, var(--oc-error, #dc2626)); font-size: 12px;
  }
  .tools { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 4px; }
  .tool {
    display: flex; gap: 6px; min-width: 0;
    font-family: var(--oc-mono, ui-monospace, monospace);
    font-size: 11px; color: var(--oc-muted, inherit);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tool-name { color: var(--oc-fg, inherit); flex: 0 0 auto; }
  .tool.failed .tool-name { color: var(--oc-error-text, #dc2626); }
  .tool-detail { overflow: hidden; text-overflow: ellipsis; }
  .composer { border-top: 1px solid var(--oc-border, rgba(127, 127, 127, .25)); padding: 8px 12px 12px; }
  .hint { font-size: 11px; color: var(--oc-muted, inherit); margin-bottom: 6px; }
  .provider-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .provider-row > * { flex: 1 1 0; min-width: 0; }
  .composer-actions { margin-left: auto; }
</style>
</head>
<body>
<div id="root">
  <header class="head">
    <span class="title">Boat</span>
    <span id="live" class="live" hidden></span>
  </header>
  <div id="banner" class="banner" hidden><div id="banner-inner"></div></div>
  <section class="block">
    <div id="sandbox-select"></div>
    <div id="sandbox-meta" class="meta"></div>
    <div id="sandbox-actions" class="row"></div>
  </section>
  <section class="block">
    <div class="section-head">
      <span class="section-title">Conversations</span>
      <div id="new-conversation" class="slot-row"></div>
    </div>
    <div class="conv-list"><div id="conversation-list"></div></div>
  </section>
  <section class="chat-wrap">
    <div id="chat-empty"></div>
    <div id="chat" class="chat" role="log" aria-live="polite"></div>
  </section>
  <section class="composer">
    <div id="composer-hint" class="hint"></div>
    <div id="provider-row" class="provider-row">
      <div id="provider-select"></div>
      <div id="model-field"></div>
    </div>
    <div id="composer-field"></div>
    <div class="row">
      <div id="composer-actions" class="slot-row composer-actions"></div>
    </div>
  </section>
</div>
<script src="./main.js"></script>
</body>
</html>
